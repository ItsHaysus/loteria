apiVersion: apps/v1
kind: Deployment
metadata:
  name: loteria
  labels:
    app.kubernetes.io/name: loteria
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: loteria
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loteria
    spec:
      containers:
        - name: nginx
          image: localhost/loteria:v1
          imagePullPolicy: Never
          env:
            - name: CLUE_API_UPSTREAM
              value: http://loteria-clue-api:8080
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 3
