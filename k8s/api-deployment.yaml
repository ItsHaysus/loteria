apiVersion: apps/v1
kind: Deployment
metadata:
  name: loteria-clue-api
  labels:
    app.kubernetes.io/name: loteria-clue-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loteria-clue-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loteria-clue-api
    spec:
      containers:
        - name: api
          image: localhost/loteria-clue-api:fake-v1
          imagePullPolicy: Never
          env:
            - name: ClueModel__Provider
              value: Fake
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 5
