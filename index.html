<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lotería" />
  <title>Card Dealer PWA</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css?v=1.3.4" />
</head>
<body>
  <header class="topbar">
    <div class="controls">
      <button id="btn-start" class="btn" data-i18n="start" data-i18n-title="startTitle">Start</button>
      <button id="btn-restart" class="btn" data-i18n="restart" data-i18n-title="restartTitle">Restart</button>
      <button id="btn-faster" class="btn" data-i18n="faster" data-i18n-title="fasterTitle">Faster (-1s)</button>
      <button id="btn-slower" class="btn" data-i18n="slower" data-i18n-title="slowerTitle">Slower (+1s)</button>
      <button id="btn-pause" class="btn" aria-pressed="false" data-i18n="pause" data-i18n-title="pauseTitle">Pause</button>
      <button id="btn-speech" class="btn" aria-pressed="false" data-i18n="voiceOff" data-i18n-title="voiceTitle">Voice: Off</button>
      <button id="btn-language" class="btn" type="button" aria-label="Cambiar idioma">Español</button>
    </div>
    <div class="status">
      <span id="speed-label" aria-live="polite" data-i18n="speedInitial">Speed: 5s / card</span>
      <span id="remaining-label" aria-live="polite" data-i18n="remainingInitial">Remaining: —</span>
    </div>
  </header>

  <main class="main">
    <div id="current-card" class="current-card" aria-live="polite">
      <div class="placeholder" data-i18n="cardsPlaceholder">Cards will appear here</div>
    </div>

    <section class="dealt-section">
      <h2 data-i18n="dealt">Dealt (in order):</h2>
      <div id="dealt-strip" class="dealt-strip" aria-live="polite"></div>
    </section>
  </main>

  <div class="version-counter" id="version-counter" aria-label="Version 1.3.4">1.3.4</div>

  <script src="script.js?v=1.3.4" defer></script>
  <script>
    // Register the service worker (required for PWA on GitHub Pages)
    if ('serviceWorker' in navigator) {
      let refreshingForUpdate = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshingForUpdate) {
          refreshingForUpdate = true;
          window.location.reload();
        }
      });
      window.addEventListener('load', async () => {
        try {
          // Version the worker URL to bypass stale iOS Home Screen app caches.
          const registration = await navigator.serviceWorker.register('./service-worker.js?v=1.3.4', {
            updateViaCache: 'none',
          });
          const checkForUpdate = () => registration.update().catch(console.error);
          checkForUpdate();
          window.addEventListener('pageshow', checkForUpdate);
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') checkForUpdate();
          });
        } catch (error) {
          console.error('Service worker registration failed:', error);
        }
      });
    }
  </script>
</body>
</html>
