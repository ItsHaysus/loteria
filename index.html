<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7edda" />
  <meta name="color-scheme" content="light dark" />
  <meta name="pwa-version" content="1.5.4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lotería" />
  <title>Lotería</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/loteria-icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <script>
    // Resolve the theme before the stylesheet paints.
    (() => {
      let preference;
      try {
        preference = localStorage.getItem('loteria-theme');
      } catch {}
      document.documentElement.dataset.theme = preference === 'dark' || preference === 'light'
        ? preference
        : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=1.5.4" />
</head>
<body>
  <header class="topbar">
    <h1>Lotería</h1>
    <label class="theme-picker">
      <span class="theme-icon" aria-hidden="true"></span>
      <select id="theme-select" aria-label="Tema de color" title="Tema de color">
        <option value="system">Del dispositivo</option>
        <option value="light">Claro</option>
        <option value="dark">Oscuro</option>
      </select>
    </label>
    <span id="remaining-label" aria-live="polite">Restantes: —</span>
  </header>

  <main class="main">
    <div id="current-card" class="current-card">
      <div id="game-status" class="game-status" role="status"></div>
      <div id="card-content" class="card-content" aria-live="polite">
        <div class="placeholder">Las cartas aparecerán aquí</div>
      </div>
    </div>

    <section class="dealt-section" aria-labelledby="dealt-heading">
      <h2 id="dealt-heading">Repartidas</h2>
      <div id="dealt-strip" class="dealt-strip" aria-live="polite"></div>
    </section>

    <div class="controls" role="group" aria-label="Controles de la partida">
      <button id="btn-start" class="btn btn-primary" title="Iniciar, pausar o continuar (Espacio)" disabled>Iniciar</button>
      <button id="btn-restart" class="btn btn-restart" title="Reiniciar el juego (R)" disabled>Reiniciar</button>
      <div class="speed-controls" role="group" aria-label="Velocidad">
        <button id="btn-faster" class="btn" aria-label="Más rápido, un segundo menos" title="Más rápido (&lt; o coma)">−</button>
        <span id="speed-label" aria-live="polite">5 s / carta</span>
        <button id="btn-slower" class="btn" aria-label="Más lento, un segundo más" title="Más lento (&gt; o punto)">+</button>
      </div>
      <button id="btn-ai" class="btn" aria-pressed="false" title="Activar pistas opcionales de IA" hidden>Pistas de IA: desactivadas</button>
    </div>
  </main>

  <span id="pwa-version" class="version-watermark" aria-label="Versión de la PWA"></span>

  <script src="ai-clue.js?v=1.4.4" defer></script>
  <script src="script.js?v=1.5.2" defer></script>
  <script>
    const pwaVersion = document.querySelector('meta[name="pwa-version"]').content;
    document.getElementById('pwa-version').textContent = `PWA v${pwaVersion}`;

    // Register the service worker for the HTTPS-hosted PWA.
    if ('serviceWorker' in navigator) {
      let refreshingForUpdate = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshingForUpdate) {
          refreshingForUpdate = true;
          window.location.reload();
        }
      });
      window.addEventListener('load', async () => {
        try {
          // Version the worker URL to bypass stale iOS Home Screen app caches.
          const registration = await navigator.serviceWorker.register(`./service-worker.js?v=${encodeURIComponent(pwaVersion)}`, {
            updateViaCache: 'none',
          });
          const checkForUpdate = () => registration.update().catch(console.error);
          checkForUpdate();
          window.addEventListener('pageshow', checkForUpdate);
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') checkForUpdate();
          });
        } catch (error) {
          console.error('Service worker registration failed:', error);
        }
      });
    }
  </script>
</body>
</html>
