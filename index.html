<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lotería" />
  <title>Card Dealer PWA</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="controls">
      <button id="btn-start" class="btn" title="Start the game">Start</button>
      <button id="btn-restart" class="btn" title="Restart game (R)">Restart</button>
      <button id="btn-faster" class="btn" title="Speed up (< or comma)">Faster (-1s)</button>
      <button id="btn-slower" class="btn" title="Slow down (> or period)">Slower (+1s)</button>
      <button id="btn-pause" class="btn" aria-pressed="false" title="Pause/Resume (Space)">Pause</button>
      <button id="btn-speech" class="btn" aria-pressed="false" title="Enable/disable spoken card names">Voice: Off</button>
    </div>
    <div class="status">
      <span id="speed-label" aria-live="polite">Speed: 5s / card</span>
      <span id="remaining-label" aria-live="polite">Remaining: —</span>
    </div>
  </header>

  <main class="main">
    <div id="current-card" class="current-card" aria-live="polite">
      <div class="placeholder">Cards will appear here</div>
    </div>

    <section class="dealt-section">
      <h2>Dealt (in order):</h2>
      <div id="dealt-strip" class="dealt-strip" aria-live="polite"></div>
    </section>
  </main>

  <button id="debug-toggle" class="debug-toggle" type="button" aria-controls="debug-panel" aria-expanded="false">Debug</button>
  <div class="version-counter" id="version-counter" aria-label="Version 1.1.0">1.1.0</div>

  <section id="debug-panel" class="debug-panel" role="dialog" aria-modal="true" aria-labelledby="debug-title" hidden>
    <div class="debug-dialog">
      <header class="debug-header">
        <div>
          <h2 id="debug-title">Viewport diagnostics</h2>
          <p>Live device and layout measurements</p>
        </div>
        <button id="debug-close" class="debug-close" type="button" aria-label="Close diagnostics">×</button>
      </header>
      <pre id="debug-output" class="debug-output" aria-live="polite"></pre>
      <footer class="debug-footer">
        <span id="debug-status" role="status">Updates on resize and orientation changes.</span>
        <button id="debug-copy" class="btn" type="button">Copy diagnostics</button>
      </footer>
    </div>
  </section>

  <script src="script.js" defer></script>
  <script>
    // Register the service worker (required for PWA on GitHub Pages)
    if ('serviceWorker' in navigator) {
      let refreshingForUpdate = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshingForUpdate) {
          refreshingForUpdate = true;
          window.location.reload();
        }
      });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' })
          .then(registration => registration.update())
          .catch(console.error);
      });
    }
  </script>
</body>
</html>
